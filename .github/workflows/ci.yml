name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: typecheck + tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: mcp_registry
          POSTGRES_PASSWORD: mcp_registry
          POSTGRES_DB: mcp_registry
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U mcp_registry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://mcp_registry:mcp_registry@127.0.0.1:5432/mcp_registry
      ADMIN_API_KEY: ci-admin-key-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Apply migrations
        run: bun run db:migrate

      - name: Run tests
        run: bun run test
